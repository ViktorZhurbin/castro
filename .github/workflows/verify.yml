name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to core/package.json's `engines.bun`
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun verify
